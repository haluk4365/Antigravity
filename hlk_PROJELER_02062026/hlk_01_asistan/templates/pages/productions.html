{% extends "base.html" %}
{% block title %}Üretimler — HLK Operasyon Merkezi{% endblock %}
{% block page_title %}🎬 Üretimler{% endblock %}
{% block content %}
<div class="table-wrap">
  <table>
    <thead><tr><th>PID</th><th>Kullanıcı</th><th>Başlangıç</th><th>Durum</th></tr></thead>
    <tbody id="prodTable"><tr><td colspan="4" class="empty-state">Yükleniyor...</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
const TOKEN = '{{ token }}';
function api(p) { return fetch('/api' + p + (p.includes('?')?'&':'?') + 'token=' + TOKEN).then(r => r.json()).catch(()=>({})); }
async function load() {
  const data = await api('/sessions');
  const sessions = data.sessions || [];
  const tbody = document.getElementById('prodTable');
  if (!sessions.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Üretim yok</td></tr>'; return; }
  tbody.innerHTML = sessions.map(s =>
    `<tr class="clickable" onclick="location.href='/pid/${s.pid}?token=${TOKEN}'">
      <td><b>${s.pid}</b></td><td>${s.kullanici || '?'}</td><td>${s.baslangic}</td>
      <td><span class="status-badge ${s.durumSinif}">${s.durum}</span></td>
    </tr>`
  ).join('');
}
load(); setInterval(load, 10000);
</script>
{% endblock %}
