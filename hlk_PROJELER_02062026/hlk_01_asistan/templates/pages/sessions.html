{% extends "base.html" %}
{% block title %}Canlı Oturumlar — HLK Operasyon Merkezi{% endblock %}
{% block page_title %}📡 Canlı Oturumlar{% endblock %}

{% block content %}
<div class="table-wrap">
  <table>
    <thead><tr><th>PID</th><th>Ürün</th><th>Aşama</th><th>Başlangıç</th><th>Durum</th></tr></thead>
    <tbody id="sessionTable"><tr><td colspan="5" class="empty-state">Yükleniyor...</td></tr></tbody>
  </table>
</div>
<p class="refresh-indicator" id="refreshNote" style="margin-top:8px;"></p>
{% endblock %}

{% block scripts %}
<script>
const TOKEN = '{{ token }}';
function api(p) { return fetch('/api' + p + (p.includes('?')?'&':'?') + 'token=' + TOKEN).then(r => r.json()).catch(()=>({})); }
async function load() {
  const data = await api('/sessions');
  const sessions = data.sessions || [];
  const tbody = document.getElementById('sessionTable');
  if (!sessions.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Henüz oturum yok. Telegram\'da /start yazın.</td></tr>'; return; }
  tbody.innerHTML = sessions.map(s =>
    `<tr class="clickable" onclick="location.href='/pid/${s.pid}?token=${TOKEN}'">
      <td><b>${s.pid}</b></td>
      <td>${s.urun || s.kullanici || '?'}</td>
      <td>${s.state || '--'}</td>
      <td>${s.baslangic}</td>
      <td><span class="status-badge ${s.durumSinif}">${s.durum}</span></td>
    </tr>`
  ).join('');
  document.getElementById('refreshNote').textContent = 'Son güncelleme: ' + new Date().toLocaleTimeString();
}
load(); setInterval(load, 5000);
</script>
{% endblock %}
