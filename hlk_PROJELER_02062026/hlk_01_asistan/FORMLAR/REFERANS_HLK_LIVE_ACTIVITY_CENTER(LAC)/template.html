<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>HLK Live Activity Center (LAC)</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --sidebar: #1e293b; }
  body { display: flex; min-height: 100vh; background: var(--page-bg); }
  .sidebar { width: 260px; background: var(--sidebar); color: #cbd5e1; padding: 24px 18px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .sidebar .logo { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: 1px; }
  .sidebar .nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar .nav-item { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 10px; transition: all .15s; }
  .sidebar .nav-item:hover,.sidebar .nav-item.active { background: rgba(255,255,255,.08); color: #fff; }
  .sidebar .nav-item .badge { margin-left: auto; background: var(--blue); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .main { flex: 1; padding: 32px; overflow-y: auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .topbar h1 { font-size: 26px; font-weight: 800; }
  .topbar .status { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--green); }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .kpi { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .value { font-size: 28px; font-weight: 800; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .table-wrap { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; padding: 12px 16px; text-align: left; font-weight: 700; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
  .layers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .layer-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .layer-card .layer-name { font-size: 13px; font-weight: 700; }
  .layer-card .layer-status { font-size: 11.5px; }
  .footer-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
{{COMPONENT:sidebar}}
<div class="main">
  <div class="topbar">
    <h1>Live Activity Center</h1>
    <div class="status"><span class="dot green"></span> Canlı • PID: <b id="currentPid">--</b></div>
  </div>
  {{COMPONENT:kpi_cards}}
  {{COMPONENT:session_table}}
  {{COMPONENT:layers_grid}}
  {{COMPONENT:event_table}}
  <div class="footer-bar" id="footerBar"></div>
</div>
<script>
const DATA = {{DATA_JSON}};
document.getElementById('currentPid').innerText = DATA.aktifPid || '--';
document.getElementById('nav').innerHTML = DATA.navItems.map(n => `<div class="nav-item${n.active?' active':''}">${n.ikon} ${n.isim}${n.sayac?`<span class="badge">${n.sayac}</span>`:''}</div>`).join('');
document.getElementById('kpiRow').innerHTML = DATA.kpi.map(k => `<div class="kpi"><span class="label">${k.label}</span><span class="value">${k.deger}</span><span class="sub">${k.alt}</span></div>`).join('');
document.getElementById('sessionTable').querySelector('tbody').innerHTML = DATA.oturumlar.map(o => `<tr><td><b>${o.pid}</b></td><td>${o.kullanici}</td><td>${o.dil}</td><td>${o.state}</td><td>${o.baslangic}</td><td><span class="status-badge ${o.durumSinif}">${o.durum}</span></td></tr>`).join('');
document.getElementById('layersGrid').innerHTML = DATA.katmanlar.map(k => `<div class="layer-card"><span class="layer-name">${k.isim}</span><span class="layer-status" style="color:${k.renk}">${k.durum}</span></div>`).join('');
document.getElementById('eventTable').querySelector('tbody').innerHTML = DATA.eventler.map(e => `<tr><td>${e.zaman}</td><td>${e.pid}</td><td><b>${e.event}</b></td><td>${e.aciklama}</td><td><span class="status-badge ${e.durumSinif}">${e.durum}</span></td></tr>`).join('');
document.getElementById('footerBar').innerHTML = `<span>🔖 HLK Live Activity Center — Resmi Referans</span><span>Kod: ${DATA.footer.kod}</span><span>Versiyon: ${DATA.footer.versiyon}</span><span>Tarih: ${DATA.footer.tarih}</span>`;
</script>
</body>
</html>
